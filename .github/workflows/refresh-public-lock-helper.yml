name: Refresh CLEAN-SAFE Public Lock Helper

on:
  push:
    branches:
      - cleanup/refresh-public-npm-lock

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: GENEVIEVE_CLEAN_SAFE_PROTOTYPE_V1/genevieve-clean-safe-prototype
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/refresh-public-npm-lock
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: rm package-lock.json
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Commit lockfile and remove helper workflow
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/refresh-public-lock-helper.yml
          git add GENEVIEVE_CLEAN_SAFE_PROTOTYPE_V1/genevieve-clean-safe-prototype/package-lock.json
          git commit -m "chore: refresh CLEAN-SAFE public npm lockfile"
          git push origin HEAD:cleanup/refresh-public-npm-lock
